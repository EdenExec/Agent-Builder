<title>Eden University</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Eden University (Q, 29 Oct 2026). One page, three audiences: a learner works a track, a supervisor signs it off, Kev reads one strip.
   Data: tracks/{id} (Dean's track.json, loaded by `npm run eu -- load`), progress/{trackId}--{userId} (the learner), signoff/{trackId}--{userId} (a supervisor).
   Brand: Montserrat, IBM Plex Mono, ink on cream, hairlines, no colour but muted state tones. */
:root{
  --bg:#FAF8F4; --paper:#FFFFFF; --ink:#141414; --mute:#6F695D; --line:#E4DED2; --line2:#CFC8B8; --wash:#F2EFE8;
  --pos:#3D6B4F; --pos-bg:#E4EEE7; --warn:#7A5E1B; --warn-bg:#F3EAD0; --neg:#8A3A32; --neg-bg:#F1DDD9; --btn:#141414; --btn-ink:#FAF8F4;
  --sans:'Montserrat','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F0E; --paper:#171716; --ink:#EDEAE3; --mute:#A09A8D; --line:#2B2A27; --line2:#3C3A35; --wash:#1E1E1C;
  --pos:#8FBF9E; --pos-bg:#1C2B21; --warn:#D4B467; --warn-bg:#2B2512; --neg:#D98A80; --neg-bg:#331D1A; --btn:#EDEAE3; --btn-ink:#0F0F0E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F0E; --paper:#171716; --ink:#EDEAE3; --mute:#A09A8D; --line:#2B2A27; --line2:#3C3A35; --wash:#1E1E1C;
  --pos:#8FBF9E; --pos-bg:#1C2B21; --warn:#D4B467; --warn-bg:#2B2512; --neg:#D98A80; --neg-bg:#331D1A; --btn:#EDEAE3; --btn-ink:#0F0F0E; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit}
h1,h2,h3,h4,p,ul,dl{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}

/* header */
.top{padding:28px 0 18px;border-bottom:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.org{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--mute)}
.top h1{font-size:30px;line-height:1.1;font-weight:700;font-style:italic;letter-spacing:-.01em;margin-top:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:8px 14px;border:1px solid transparent;color:var(--mute)}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
nav a:hover{color:var(--ink)}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:14px;padding:10px 14px;border:1px solid var(--line2);background:var(--wash);font-size:12px}
.banner b{letter-spacing:.14em;font-size:11px}
.banner label{display:flex;align-items:center;gap:8px}
select,input[type=text],input[type=url],input[type=date],textarea{background:var(--paper);border:1px solid var(--line2);border-radius:0;padding:8px 10px;min-height:40px;width:100%}
.banner select{width:auto;min-height:34px;padding:4px 8px}
#status{min-height:20px;margin-top:10px;font-size:12px;color:var(--mute)}
#status.err{color:var(--neg)}

/* sections */
main{padding-top:6px}
.sec{margin-top:36px}
.sec>h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sec>h2 span{font:400 11px var(--mono);letter-spacing:0;text-transform:none;color:var(--mute)}
.lead{margin-top:14px;max-width:62ch;color:var(--mute)}
.empty{margin-top:14px;padding:18px;border:1px dashed var(--line2);color:var(--mute)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--paper);border:1px solid var(--line);padding:18px;text-decoration:none}
.card:hover{border-color:var(--ink)}
.card h3{font-size:16px;line-height:1.25;font-weight:700}
.card .aud{color:var(--mute);font-size:12px}
.card dl{display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px;justify-content:start;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.card dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.card dd{margin:0;font:500 13px var(--mono)}
.card .go{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.mine .card{gap:8px}
.mine .nxt{font-size:12px;color:var(--mute)}

/* bars and pills */
.bar{height:6px;background:var(--wash);border:1px solid var(--line2);position:relative;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar i.sub{background:repeating-linear-gradient(135deg,var(--line2) 0 3px,transparent 3px 6px);background-color:transparent}
.pct{font:500 12px var(--mono)}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line2);white-space:nowrap}
.pill.new{color:var(--mute)}
.pill.progress{color:var(--ink);border-color:var(--ink)}
.pill.submitted{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bg)}
.pill.signed,.pill.self{color:var(--pos);background:var(--pos-bg);border-color:var(--pos-bg)}
.flag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.flag.behind{color:var(--neg)}
.flag.ok{color:var(--pos)}
.flag.idle{color:var(--mute)}
.tag-behind{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--neg);border:1px solid var(--neg);padding:1px 6px;margin-left:8px;white-space:nowrap}

/* buttons */
.btn{display:inline-block;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);padding:9px 16px;min-height:40px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.small{min-height:34px;padding:6px 12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* tables */
.tw{margin-top:14px;overflow-x:auto}
table.rt{width:100%;border-collapse:collapse}
.rt th{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--mute);padding:8px 12px;border-bottom:1px solid var(--ink)}
.rt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt td.nm{font-weight:600}
.rt .barcell{min-width:170px}
.rt .barcell .pct{display:block;margin-bottom:4px}
.rt tr.who>td{cursor:pointer}
.rt tr.who:hover>td{background:var(--wash)}
.rt tr.dd>td{background:var(--paper);padding:0;border-bottom:1px solid var(--ink)}
.rt .num{font-family:var(--mono);font-size:12px}
.linkbtn{background:none;border:0;padding:0;font-weight:600;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* track view */
.crumb{margin-top:22px;font-size:12px}
.thead{margin-top:10px;display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-end}
.thead h2{font-size:26px;line-height:1.15;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:12px;color:var(--mute)}
.meta b{color:var(--ink);font-family:var(--mono);font-weight:500}
.startbox{margin-top:18px;padding:16px;border:1px solid var(--ink);background:var(--paper);display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.startbox label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);min-width:200px;flex:1}
.progress-line{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.progress-line .bar{flex:1;min-width:160px;max-width:420px}
.phase{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0 28px;margin-top:30px;padding-top:14px;border-top:1px solid var(--ink)}
.phase>header{min-width:0}
.phase h3{font-size:15px;font-weight:700;line-height:1.25}
.phase .win{margin-top:4px;font:400 11px/1.5 var(--mono);color:var(--mute)}
.mods{min-width:0;border-top:1px solid var(--line)}
.mod{border-bottom:1px solid var(--line)}
.mod-h{display:grid;grid-template-columns:52px minmax(0,1fr) 70px 96px 112px;gap:6px 12px;align-items:center;width:100%;background:none;border:0;padding:14px 4px;text-align:left;cursor:pointer}
.mod-h:hover{background:var(--wash)}
.mod-h .mid{font:500 11px var(--mono);color:var(--mute)}
.mod-h .mt{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mod-h .mm,.mod-h .mc{font:400 12px var(--mono);color:var(--mute)}
.mod-h[aria-expanded=true]{background:var(--wash)}
.mod-d{padding:6px 4px 22px 68px;display:grid;gap:18px;max-width:78ch}
.mod-d h4{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.steps{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.step{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.step input{margin-top:4px;width:16px;height:16px;accent-color:var(--ink);flex:none}
.step span{min-width:0;overflow-wrap:anywhere}
.step.on span{color:var(--mute);text-decoration:line-through}
.warnbox{padding:10px 12px;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);font-size:12px}
.fld{display:grid;gap:4px}
.fld label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
textarea{min-height:110px;resize:vertical}
.note{font-size:12px;color:var(--mute)}
.signed-by{padding:10px 12px;border:1px solid var(--pos);background:var(--pos-bg);color:var(--pos);font-size:12px}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.proof{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;border:1px solid var(--line);background:var(--bg);font-size:13px}

/* supervisor drill-down */
.dd-in{padding:6px 12px 18px}
.dd-in .dmod{display:grid;grid-template-columns:52px minmax(0,1fr) 112px;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.dd-in .dmod>div{min-width:0}
.dd-in .dmod .proof{margin-top:8px}
.dd-in .sg{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dd-in .sg input{flex:1;min-width:180px}
.dd-top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 0;font-size:12px}
.dd-top input{width:auto;min-height:34px}

footer{margin-top:56px;padding-top:14px;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:var(--mute)}
footer .sync{font:400 11px var(--mono);letter-spacing:0}

@media (max-width:760px){
  .top h1{font-size:24px}
  .phase{grid-template-columns:minmax(0,1fr);gap:8px}
  .mods{margin-top:6px}
  .mod-h{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"id t t" ". m s"}
  .mod-h .mid{grid-area:id}.mod-h .mt{grid-area:t}.mod-h .mm{grid-area:m}.mod-h .mc{display:none}.mod-h .st{grid-area:s;justify-self:end}
  .mod-d{padding-left:4px}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr.who{border-bottom:1px solid var(--line);padding:10px 0}
  .rt tr.who>td{border:0;padding:3px 4px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .rt tr.who>td::before{content:attr(data-l);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);flex:none}
  .rt tr.who>td.nm{font-size:15px}
  .rt .barcell{min-width:0}
  .rt .barcell .pct{display:inline;margin:0}
  .rt .barcell .bar{width:120px}
  .dd-in .dmod{grid-template-columns:40px minmax(0,1fr)}
  .dd-in .dmod>.st{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';
var DAY=864e5, GRACE=3;
var CHECKER={bridger:'Bridger',jenny:'Jenny',nick:'Nick',kev:'Kev',self:'Self-check'};
var STATUS={new:'Not started',progress:'In progress',submitted:'Submitted',signed:'Signed off',self:'Done'};
var state={mode:'boot',example:false,db:null,me:null,myName:'',isSup:false,tracks:[],progress:{},signoff:{},unsubs:[],unsubT:null,subKey:'',
  drafts:{},open:{},openL:{},startDraft:{},msg:'',err:false,syncedAt:null,loaded:false};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var now=function(){return Date.now()};
var pkey=function(t,u){return t+'--'+u};
var fmtDate=function(ts){return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
var isoDay=function(ts){var d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var dayTs=function(s){return new Date(s+'T00:00:00').getTime()};
var qa=function(s){return String(s).replace(/["\\]/g,'')};
var safeUrl=function(u){return /^https?:\/\/[^\s]+$/i.test(String(u||''))};

/* ---------- the arithmetic (mirrors workshop/core/eden-university.ts, which has the unit tests) ---------- */
function moduleStatus(m,p,s){
  if(s&&s.modules&&s.modules[m.id])return 'signed';
  if(p&&p.submissions&&p.submissions[m.id])return m.checker==='self'?'self':'submitted';
  return(p&&p.steps&&p.steps[m.id]&&p.steps[m.id].length>0)?'progress':'new';
}
var isDone=function(st){return st==='signed'||st==='self'};
function percent(t,p,s){var n=t.modules.length;if(!n)return 0;return Math.round(100*t.modules.filter(function(m){return isDone(moduleStatus(m,p,s))}).length/n)}
function phaseOf(t,m){return t.phases.find(function(x){return x.id===m.phase})}
function phaseEnd(t,m,start){var ph=phaseOf(t,m);return dayTs(start)+(ph?ph.weekTo:t.weeks)*7*DAY}
function behind(t,p,s){
  if(!p||!p.startDate)return[];
  return t.modules.filter(function(m){var st=moduleStatus(m,p,s);return st!=='signed'&&st!=='self'&&st!=='submitted'&&now()>phaseEnd(t,m,p.startDate)+GRACE*DAY});
}
function awaiting(t,p,s){return t.modules.filter(function(m){return moduleStatus(m,p,s)==='submitted'}).length}
function lastAct(p){return p&&(p.lastActivity||p.startedAt)||''}
function rel(iso){
  if(!iso)return 'no activity yet';
  var d=Math.floor((now()-new Date(iso).getTime())/DAY);
  if(d<=0)return 'today';if(d===1)return 'yesterday';if(d<14)return d+' days ago';return Math.floor(d/7)+' weeks ago';
}

/* ---------- what may be typed into the proof box ---------- */
function scanText(txt,link){
  var t=String(txt||'');
  if(/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}/.test(t))return 'It looks like it contains an email address.';
  if(/(?:\+?1[\s.-]?)?\(?\b\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}\b/.test(t))return 'It looks like it contains a phone number.';
  if(/\b\d{3}-\d{2}-\d{4}\b/.test(t))return 'It looks like it contains an ID number.';
  if(/(password|passwd|pwd|api[_ -]?key|secret|token)\s*[:=]\s*\S+/i.test(t)||/\b(sk|pk|ghp|xox[bp]|AKIA)[-_A-Za-z0-9]{12,}/.test(t))return 'It looks like it contains a password or key.';
  if(/(salary|pay|wage|rate|comp\w*|stipend)\D{0,14}\$\s?\d/i.test(t))return 'It looks like it contains a pay figure.';
  if(link){if(!safeUrl(link))return 'The link must start with http:// or https://.';if(/(token|key|password|secret|sig)=/i.test(link))return 'The link looks like it carries a key or token. Use a plain share link.'}
  return '';
}

/* ---------- example mode: the same db interface, in memory, with the same write rules the live page declares ---------- */
function memDb(seed,level){
  var data=JSON.parse(JSON.stringify(seed)),subs=[];
  var parts=function(p){var a=p.split('/');return{col:a[0],id:a.slice(1).join('/')}};
  var can=function(col){return col==='tracks'?level()==='admin':col==='signoff'?level()==='admin':true};
  var emit=function(){subs.slice().forEach(function(f){f()})};
  var snapDoc=function(p){var x=parts(p);var v=(data[x.col]||{})[x.id];return{exists:v!==undefined,id:x.id,data:function(){return v===undefined?undefined:JSON.parse(JSON.stringify(v))}}};

  return{
    doc:function(p){var x=parts(p);return{
      onSnapshot:function(cb){var f=function(){setTimeout(function(){cb(snapDoc(p))},0)};subs.push(f);f();return function(){subs=subs.filter(function(y){return y!==f})}},
      set:function(v){if(!can(x.col))return reject();(data[x.col]=data[x.col]||{})[x.id]=JSON.parse(JSON.stringify(v));emit();return Promise.resolve()},
      update:function(v){if(!can(x.col))return reject();var o=(data[x.col]=data[x.col]||{});o[x.id]=Object.assign({},o[x.id],JSON.parse(JSON.stringify(v)));emit();return Promise.resolve()},
      delete:function(){if(!can(x.col))return reject();if(data[x.col])delete data[x.col][x.id];emit();return Promise.resolve()}}},
    collection:function(c){return{onSnapshot:function(cb){var f=function(){setTimeout(function(){cb(snapCol(c))},0)};subs.push(f);f();return function(){subs=subs.filter(function(y){return y!==f})}}}}
  };
}

    state.tracks=s.docs.map(function(d){return normTrack(d.data(),d.id)}).sort(function(a,b){return String(a.title).localeCompare(b.title)});

    ms.forEach(function(m){
      var st=moduleStatus(m,p,s),k=t.id+':'+m.id,late=p&&behind(t,p,s).some(function(x){return x.id===m.id});
      h+='<div class="mod" data-mod="'+esc(k)+'"><button class="mod-h" data-act="toggle" data-k="'+esc(k)+'" aria-expanded="'+(state.open[k]?'true':'false')+'" aria-controls="d-'+esc(k)+'">'+
        '<span class="mid">'+esc(m.id)+'</span><span class="mt">'+esc(m.title)+(late?'<span class="tag-behind">Behind</span>':'')+'</span><span class="mm">'+m.minutes+' min</span><span class="mc">'+esc(CHECKER[m.checker]||m.checker)+'</span><span class="st">'+pill(st)+'</span></button>'+modDetail(t,m,p,s)+'</div>';
    });
    h+='</div></section>';
  });
  return h;
}
function rosterRow(t,r){
  var k=r.k,open=!!state.openL[k],b=barFor(t,r.p,r.s),colspan=6,h='';
  h+='<tr class="who" data-act="learner" data-k="'+esc(k)+'"><td class="nm" data-l="Learner"><button class="linkbtn" data-act="learner" data-k="'+esc(k)+'" aria-expanded="'+open+'">'+esc(r.p.name||'Learner')+'</button></td>'+
    '<td class="num" data-l="Started">'+(r.p.startDate?fmtDate(dayTs(r.p.startDate)):'')+'</td><td class="barcell" data-l="Done"><span class="pct">'+r.pct+'%</span>'+b.html+'</td><td class="num" data-l="Waiting">'+r.aw+'</td><td class="num" data-l="Last activity">'+esc(rel(r.last))+'</td><td data-l="Flag">'+flagHtml(r)+'</td></tr>';
  if(open){
    h+='<tr class="dd"><td colspan="'+colspan+'"><div class="dd-in"><div class="dd-top"><span>Start date <input type="date" data-act="startdate" data-t="'+esc(t.id)+'" data-u="'+esc(r.p.userId)+'" value="'+esc(r.p.startDate||'')+'" aria-label="Start date"></span><span class="mute">Behind means a module not submitted more than '+GRACE+' days after its phase window closed.</span></div>';
    t.modules.forEach(function(m){
      var st=moduleStatus(m,r.p,r.s),sub=r.p.submissions&&r.p.submissions[m.id],sg=r.s&&r.s.modules&&r.s.modules[m.id],late=behind(t,r.p,r.s).some(function(x){return x.id===m.id});
      h+='<div class="dmod"><span class="mono mute">'+esc(m.id)+'</span><div><b>'+esc(m.title)+'</b>'+(late?'<span class="tag-behind">Behind</span>':'')+'<div class="note">'+esc(CHECKER[m.checker]||m.checker)+' · '+m.minutes+' min'+(r.p.startDate?' · due '+fmtDate(phaseEnd(t,m,r.p.startDate)-DAY):'')+'</div>';
      if(sub){
        h+='<div class="proof">'+esc(sub.text||'(no text)')+'</div>'+(safeUrl(sub.link)?'<p class="note"><a href="'+esc(sub.link)+'" target="_blank" rel="noopener noreferrer">'+esc(sub.link)+'</a></p>':'')+'<p class="note">Submitted '+fmtDate(new Date(sub.at).getTime())+'</p>';
        if(st==='submitted')h+='<div class="sg"><input type="text" maxlength="300" data-note="'+esc(k)+':'+esc(m.id)+'" placeholder="Note (optional)" aria-label="Sign-off note"><button class="btn small" data-act="signoff" data-t="'+esc(t.id)+'" data-u="'+esc(r.p.userId)+'" data-m="'+esc(m.id)+'">Sign off</button></div>';
        if(st==='signed')h+='<div class="sg"><span class="note">Signed off by '+esc(sg.byName||'a supervisor')+' on '+fmtDate(new Date(sg.at).getTime())+(sg.note?' · “'+esc(sg.note)+'”':'')+'</span><button class="btn ghost small" data-act="undo" data-t="'+esc(t.id)+'" data-u="'+esc(r.p.userId)+'" data-m="'+esc(m.id)+'">Undo</button></div>';
      }
      h+='</div><span class="st">'+pill(st)+'</span></div>';
    });
    h+='</div></td></tr>';
  }
  return h;
}
function teamView(){
  var h='<p class="lead">Learners appear here once they start a track. Open a name to read their proof and sign off submitted modules.</p>'+(state.myName?'':'<div class="startbox"><label>Your name, shown on your sign-offs<input type="text" id="supname" maxlength="60" placeholder="First and last name"></label></div>')+stripView();
  var rows=stripRows();
  state.tracks.forEach(function(t){
    var rs=rows.filter(function(r){return r.t.id===t.id});if(!rs.length)return;
    h+='<section class="sec"><h2>'+esc(t.title)+'<span>Supervisor '+esc(t.supervisor)+' · '+rs.length+' learner'+(rs.length===1?'':'s')+'</span></h2><div class="tw"><table class="rt"><thead><tr><th>Learner</th><th>Started</th><th>Done</th><th>Waiting</th><th>Last activity</th><th>Flag</th></tr></thead><tbody>';
    rs.forEach(function(r){h+=rosterRow(t,r)});
    h+='</tbody></table></div></section>';
  });
  return h;
}

/* ---------- render ---------- */
var raf=0;
function scheduleRender(){if(raf)return;raf=setTimeout(function(){raf=0;render()},30)}
function ensureName(){
  if(state.myName||!state.me)return;
  try{var n=localStorage.getItem('eu-name');if(n&&n.indexOf('@')<0){state.myName=n;return}}catch(_){}
  Object.keys(state.progress).some(function(k){var p=state.progress[k];if(p&&p.userId===state.me.id&&p.name){state.myName=p.name;return true}});
}
function render(){
  ensureName();
  var a=document.activeElement,keep=null;
  if(a&&a.closest&&a.closest('#app')&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&(a.dataset.draft||a.id)){keep={sel:a.dataset.draft?'[data-draft="'+qa(a.dataset.draft)+'"]':'#'+qa(a.id).replace(/[^A-Za-z0-9_:-]/g,''),s:a.selectionStart,e:a.selectionEnd}}
  renderNav();renderBanner();
  var r=route(),app=$('#app');
  app.innerHTML=r.v==='track'?trackView(r.id):r.v==='team'?teamView():homeView();
  if(keep){var el=app.querySelector(keep.sel);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(_){}}}
  $('#sync').textContent=state.syncedAt?((state.example?'Example data':'Live')+' · updated '+new Date(state.syncedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})):'';
  if(state.msg){var st=$('#status');st.textContent=state.msg;st.className=state.err?'err':''}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'&&el.type!=='button')return;
  var act=el.dataset.act;
  if(act==='toggle'){var k=el.dataset.k;state.open[k]=!state.open[k];el.setAttribute('aria-expanded',state.open[k]?'true':'false');var d=document.getElementById('d-'+k);if(d)d.hidden=!state.open[k];return}
  if(act==='start'){var nm=$('#sname');if(nm)state.startDraft.name=nm.value;var dt=$('#sdate');if(dt&&dt.value)state.startDraft.date=dt.value;startTrack(el.dataset.t);return}
  if(act==='submit'){submitProof(el.dataset.t,el.dataset.m);return}
  if(act==='learner'){var lk=el.dataset.k;state.openL[lk]=!state.openL[lk];render();return}
  if(act==='signoff'){signOff(el.dataset.t,el.dataset.u,el.dataset.m);return}
  if(act==='undo'){undoSignoff(el.dataset.t,el.dataset.u,el.dataset.m);return}
});
document.addEventListener('input',function(e){
  var d=e.target.dataset&&e.target.dataset.draft;if(!d)return;
  var i=d.lastIndexOf(':'),k=d.slice(0,i),f=d.slice(i+1);(state.drafts[k]=state.drafts[k]||{})[f]=e.target.value;
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.act==='tick'){tick(el.dataset.t,el.dataset.m,Number(el.dataset.i),el.checked);return}
  if(el.dataset.act==='startdate'){setStartDate(el.dataset.t,el.dataset.u,el.value);return}
  if(el.id==='sdate')state.startDraft.date=el.value;
  if(el.id==='sname')state.startDraft.name=el.value;
  if(el.id==='supname'){var v=el.value.trim();if(v&&v.indexOf('@')<0){state.myName=v;try{localStorage.setItem('eu-name',v)}catch(_){}render()}}
  if(el.id==='persona')usePersona(el.value);
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});

/* ---------- boot ---------- */
var exDb=null,exLevel='interact';
function usePersona(id){
  var p=PERSONAS.find(function(x){return x.id===id})||PERSONAS[0];
  state.me={id:p.id};state.myName=p.name;state.isSup=p.sup;exLevel=p.sup?'admin':'interact';
  state.progress={};state.signoff={};state.openL={};say('');
  subscribe();render();
}
function bootExample(why){
  state.example=true;exDb=memDb(exampleSeed(),function(){return exLevel});state.db=exDb;
  usePersona(PERSONAS[0].id);
  if(why)say(why,true);
}
function boot(){
  var rt=window.claude;
  if(!rt||typeof rt.use!=='function'){bootExample();return}
  rt.use('db').then(function(db){
    if(!db){bootExample('The university database is not connected, so this is example data.');return}
    state.db=db;
    return Promise.resolve(rt.use('user').catch(function(){return null})).then(function(u){
      var meP=u&&typeof u.me==='function'?Promise.resolve(u.me()).catch(function(){return null}):Promise.resolve(null);
      var supP=u&&typeof u.can==='function'?Promise.resolve(u.can('data.write')).catch(function(){return false}):Promise.resolve(false);
      return Promise.all([meP,supP]);
    }).then(function(r){
      var me=r[0];state.isSup=r[1]===true;
      if(me&&me.id){state.me={id:String(me.id)};var n=String(me.name||me.displayName||'');if(n&&n.indexOf('@')<0)state.myName=n}
      subscribe();render();
    });
  }).catch(function(){bootExample('The university database is not connected, so this is example data.')});
}
render();boot();
window.__eu={state:state,scanText:scanText,moduleStatus:moduleStatus,percent:percent,behind:behind};
})();
</script>
