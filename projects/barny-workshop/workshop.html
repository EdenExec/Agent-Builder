<title>Barny's Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: a quiet study room. A slim rail of rooms on the left (tabs on a phone), one reading column in the middle, a margin column for the rhythm and notes. */
:root{
  /* Eden visual system (workshop/brand/eden.ts), KDTW identity: cream and white, ink lettering, ink as the only accent; semantic colours mark state only. */
  --bg:#FAF8F3; --page:#FFFFFF; --ink:#111111; --mute:#5A5A5A; --line:#D9D6CE; --soft:#F0EDE6;
  --accent:#111111; --accent-ink:#FFFFFF; --pos:#3D6B4F; --warn:#7A5A1C;
  --display:'Cinzel',Georgia,serif;   /* the title only (Kev, 2 Nov: "very greek inspired ancient text, all good there") */
  --read:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --ui:'Montserrat','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--page:#1D1D1C;--ink:#F2F0EA;--mute:#A3A09A;--line:#2F2F2D;--soft:#232321;--accent:#F2F0EA;--accent-ink:#111111;--pos:#7DB391;--warn:#D2A95C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151515;--page:#1D1D1C;--ink:#F2F0EA;--mute:#A3A09A;--line:#2F2F2D;--soft:#232321;--accent:#F2F0EA;--accent-ink:#111111;--pos:#7DB391;--warn:#D2A95C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px}
header.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font:600 26px/1.1 var(--display);letter-spacing:.08em;margin:0}
.sub{color:var(--mute);font-size:13px}
.eyebrow{font:600 11px/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
nav.rooms{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
nav.rooms a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:4px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rooms a small{color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
nav.rooms a:hover{background:var(--page)} nav.rooms a[aria-current="page"]{background:var(--soft);font-weight:600}
nav.rooms a:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.room-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font:700 20px/1.2 var(--ui);letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:600 16px/1.35 var(--ui);margin:0;text-wrap:balance}
h4{margin:0}
p{margin:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.sheet{background:var(--page);border:1px solid var(--line);border-radius:4px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.reading{font:400 16px/1.7 var(--read);max-width:68ch}
.reading blockquote{margin:0;padding:4px 0 4px 16px;border-left:2px solid var(--ink);font-style:italic}
.ref{align-self:flex-start;font:500 13px/1.3 var(--ui);color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor}
.passage{display:flex;flex-direction:column;gap:6px}
.passage .big{font:700 24px/1.2 var(--ui);letter-spacing:.02em}
ol.q,ul.q{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
dl.words{margin:0;display:flex;flex-direction:column;gap:10px} dl.words dt{font-weight:600} dl.words dd{margin:2px 0 0;color:var(--ink)}
.grade{display:inline-block;font:600 10px/1 var(--ui);letter-spacing:.1em;padding:3px 6px;border-radius:4px;background:transparent;border:1px solid var(--line);color:var(--mute);vertical-align:2px;margin-left:6px}
.grade.TEXT{background:var(--soft);border-color:var(--soft);color:var(--ink)} .grade.CONSENSUS{border-color:var(--pos);color:var(--pos)}
.grade.DISPUTED{border-color:var(--warn);color:var(--warn)} .grade.SUGGESTION{border-color:var(--mute);color:var(--mute)}
.practice{border-top:1px solid var(--line);padding-top:12px}
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.rhythm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rhythm li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.rhythm li:last-child{border-bottom:0} .rhythm li.done span.t{color:var(--mute);text-decoration:line-through}
.rhythm .m{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:2px 0 0}
button{font:500 14px/1 var(--ui);border:1px solid var(--line);background:var(--page);color:var(--ink);padding:9px 14px;border-radius:4px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.link{border:0;background:none;padding:4px 0;color:var(--ink);text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
textarea,select,input[type=text]{font:15px/1.55 var(--read);width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px/1 var(--ui);padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:var(--page);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.entry .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.entry .body{font:400 15.5px/1.7 var(--read);white-space:pre-wrap;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--page);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .kind{font:500 12px/1.3 var(--ui);color:var(--mute)}
.card p{font:400 14.5px/1.6 var(--read)}
.card .caution{font-size:13px;color:var(--mute);font-style:italic}
.status{font:600 10.5px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.status.now{border-color:var(--ink);color:var(--ink)} .status.next{border-color:var(--pos);color:var(--pos)}
details.study{background:var(--page);border:1px solid var(--line);border-radius:4px}
details.study>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
details.study>summary::-webkit-details-marker{display:none}
details.study .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.sessions{list-style:none;margin:0;padding:0} .sessions li{display:grid;grid-template-columns:24px 28px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.sessions .n{font:600 12px/1.6 var(--ui);color:var(--mute);font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font:italic 400 15px/1.6 var(--read)}
.note{font-size:13px;color:var(--mute)}
.stream{display:flex;flex-direction:column;gap:12px}
.stream-h{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--ink);padding-left:12px}
.answer{font:400 15.5px/1.7 var(--read);white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.rooms{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.rooms a{white-space:nowrap} nav.rooms a small{display:none}
  .sheet{padding:16px}
}
footer.kd{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 11px/1.3 var(--ui);letter-spacing:.14em;color:var(--mute)}
/* Kev's monogram (6 Oct 2026 stationery spec): KDTW in a small hairline ring, Montserrat 600, tracked .08em, ink at 80% */
.mono{width:34px;height:34px;flex:none;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:600 8.5px/1 var(--ui);letter-spacing:.08em;padding-left:.08em;color:var(--ink);opacity:.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div><span class="eyebrow">KDTW GROUP · Sabbath study</span><h1>BARNY'S WORKSHOP</h1></div>
    <div class="sub" id="state">Opening the workshop…</div>
  </header>
  <nav class="rooms" aria-label="Rooms">
    <a href="#sabbath" data-room="sabbath">This Sabbath</a>
    <a href="#journal" data-room="journal">Journal <small id="n-journal"></small></a>
    <a href="#studies" data-room="studies">Studies <small id="n-studies"></small></a>
    <a href="#people" data-room="people">Saints and teachers <small id="n-people"></small></a>
    <a href="#charts" data-room="charts">Charts and maps</a>
    <a href="#ahead" data-room="ahead">Look ahead</a>
    <a href="#podcasts" data-room="podcasts">Podcasts</a>
  </nav>
  <main id="main" aria-live="polite"></main>
  <footer class="kd"><span>KDTW GROUP</span><span class="mono" role="img" aria-label="KDTW monogram">KDTW</span></footer>
</div>

<script>
(function () {
  var ROOMS = ['sabbath', 'journal', 'studies', 'people', 'charts', 'ahead', 'podcasts'];
  var KINDS = [['learned', 'Learned this week'], ['study', 'Study note'], ['question', 'Question'], ['prayer', 'Prayer'], ['carry', 'To carry']];
  var S = { db: null, uid: null, live: false, sabbath: [], framework: null, studies: [], people: [], next: [], podcasts: [], charts: [], journal: [], progress: {}, rhythm: {}, pick: null, sample: null, filter: 'all', peopleKind: 'all', draft: null, asking: false, answer: '' };
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, attrs) {
    var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    for (var k in attrs || {}) { var v = attrs[k]; if (v == null || v === false) continue; if (k === 'text') el.textContent = v; else if (k === 'class') el.className = v; else el.setAttribute(k, v === true ? '' : v); }
    kids.forEach(function (c) { if (c == null || c === false) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

  function short(d) { var x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + x.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function link(text, href, cls) { return href ? h('a', { class: cls || 'ref', href: href, target: '_blank', rel: 'noopener' }, text) : h('span', null, text); }
  function grade(g) { return g ? h('span', { class: 'grade ' + g, title: { TEXT: 'What the passage plainly says', CONSENSUS: 'Historic orthodox teaching', DISPUTED: 'Faithful Christians differ', SUGGESTION: 'Barny\'s suggestion, not binding' }[g] || '' , text: g }) : null; }
  function room() { var r = (location.hash || '').slice(1); if (ROOMS.indexOf(r) < 0) r = store('bw-room'); return ROOMS.indexOf(r) >= 0 ? r : 'sabbath'; }   // opened from the Home Screen with no #, it returns to the last room

  /* ---------- data ---------- */
  function listen(path, key, sort) {
    S.db.collection(path).onSnapshot(function (snap) {
      var a = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (sort) a.sort(sort); S[key] = a; render();
    }, function () {});
  }
  function boot() {
    S.draft = store('bw-draft') || null;
    render();
    if (!window.claude || !window.claude.use) { $('#state').textContent = 'Open this page in Claude to use the workshop.'; return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) { $('#state').textContent = 'Sign in to Claude to open the workshop.'; render(); return; }
      S.db = db; S.live = true;
      return user.id().then(function (id) {
        S.uid = id;
        listen('sabbath', 'sabbath', function (a, b) { return String(b.date || b.id).localeCompare(String(a.date || a.id)); });
        listen('studies', 'studies', function (a, b) { return (a.order || 0) - (b.order || 0); });
        listen('people', 'people', function (a, b) { var y = function (x) { var m = String(x.years || '').match(/\d+/); return m ? +m[0] : 0; }; return y(a) - y(b); });
        listen('next', 'next', function (a, b) { return (a.order || 0) - (b.order || 0); });
        listen('podcasts', 'podcasts', function (a, b) { return (a.order || 0) - (b.order || 0); });
        listen('charts', 'charts', function (a, b) { return (a.order || 0) - (b.order || 0); });
        db.doc('meta/framework').onSnapshot(function (s) { S.framework = s.exists ? s.data() : null; render(); }, function () {});
        db.collection('data/users/' + id).onSnapshot(function (snap) {
          var j = [];
          snap.docs.forEach(function (d) {
            var v = d.data() || {};
            if (d.id === 'progress') S.progress = v.studies || {};
            else if (d.id === 'choices') S.pick = v.next || null;
            else if (d.id.indexOf('rhythm-') === 0) S.rhythm[d.id.slice(7)] = v.ticks || {};
            else if (d.id.indexOf('j-') === 0) j.push(Object.assign({ id: d.id }, v));
          });
          j.sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
          S.journal = j; render();
        }, function () {});
        $('#state').textContent = 'Your journal is private to you.';
        render();
      });
    }).catch(function () { $('#state').textContent = 'The workshop could not open its store. Reload to try again.'; });
    if (window.claude && window.claude.use) window.claude.use('sample').then(function (s) { S.sample = s; render(); }, function () {});
  }
  function mine(k) { return S.db.collection('data/users/' + S.uid).doc(k); }
  function saved(p) { return p.then(function (x) { $('#state').textContent = 'Saved ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · private to you'; return x; }, function (e) { $('#state').textContent = 'Not saved. Check your connection and try again.'; throw e; }); }
  function saveEntry(e) {
    if (!S.live) return Promise.reject(new Error('offline'));
    var id = e.id || ('j-' + Date.now().toString(36));
    var doc = { kind: e.kind, text: e.text, ref: e.ref || '', prompt: e.prompt || '', sabbath: e.sabbath || '', at: e.at || new Date().toISOString(), edited: e.id ? new Date().toISOString() : null, notion: e.notion || false };
    return saved(mine(id).set(doc));
  }

  /* ---------- rooms ---------- */
  function render() {
    var r = room(), m = $('#main');
    document.querySelectorAll('nav.rooms a').forEach(function (a) { if (a.getAttribute('data-room') === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $('#n-journal').textContent = S.journal.length || '';
    $('#n-studies').textContent = S.studies.length || '';
    $('#n-people').textContent = S.people.length || '';
    var ae = document.activeElement, keep = ae && ae.id && m.contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
    if (keep && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName)) return;   // never rebuild under someone typing
    m.textContent = '';
    ({ sabbath: roomSabbath, journal: roomJournal, studies: roomStudies, people: roomPeople, charts: roomCharts, ahead: roomAhead, podcasts: roomPodcasts })[r](m);
  }

  function roomSabbath(m) {
    var s = S.sabbath[0];
    m.appendChild(h('div', { class: 'room-h' }, h('h2', { text: 'This Sabbath' }), h('span', { class: 'eyebrow', text: s ? fmtDate(s.date || s.id) : '' })));
    if (!s) { m.appendChild(h('div', { class: 'sheet' }, h('p', { class: 'empty', text: S.live ? 'Barny sets out each Sabbath\'s passage, study and practice here by Friday afternoon.' : 'The passage, study and practice for the Sabbath appear here.' }))); return; }
    var cols = h('div', { class: 'cols' }), sh = h('article', { class: 'sheet reading' });
    var p = s.passage || {};
    sh.appendChild(h('div', { class: 'passage' }, h('span', { class: 'eyebrow', text: s.title || 'The passage' }), h('span', { class: 'big', text: p.ref || '' }), p.link ? link('Read it in the ESV', p.link) : null, p.why ? h('p', { class: 'note', text: p.why }) : null));
    if (s.readAloud) sh.appendChild(h('blockquote', { text: s.readAloud }));
    if (s.readAloud && s.readAloudNote) sh.appendChild(h('p', { class: 'note', text: s.readAloudNote }));
    if (s.setting) { sh.appendChild(h('h3', { text: 'The setting' })); sh.appendChild(h('p', { text: s.setting })); }
    list(sh, 'Look closely', s.observe, 'ol');
    if ((s.words || []).length) { sh.appendChild(h('h3', { text: 'Word by word' })); var dl = h('dl', { class: 'words' }); s.words.forEach(function (w) { dl.appendChild(h('dt', null, '“' + w.word + '”' + (w.orig ? ' · ' + w.orig : ''), grade(w.grade))); dl.appendChild(h('dd', { text: w.note || '' })); }); sh.appendChild(dl); }
    if ((s.crossRefs || []).length) { sh.appendChild(h('h3', { text: 'Across the Bible' })); var ul = h('ul', { class: 'q' }); s.crossRefs.forEach(function (c) { ul.appendChild(h('li', null, link(c.ref, c.link), c.note ? ' · ' + c.note : '')); }); sh.appendChild(ul); }
    list(sh, 'Reflect', s.reflect, 'ol');
    if (s.practice) sh.appendChild(h('div', { class: 'practice' }, h('span', { class: 'eyebrow', text: 'Practice' + (s.practice.stream ? ' · ' + s.practice.stream : '') }), h('h3', { text: s.practice.name || '' }), h('p', { text: s.practice.how || '' })));
    if (s.pray) { sh.appendChild(h('h3', { text: 'Pray' })); sh.appendChild(h('p', { text: s.pray })); }
    if (s.carry) sh.appendChild(h('p', { class: 'note' }, 'Carry into the week: ', link(s.carry, s.carryLink || 'https://www.esv.org/' + encodeURIComponent(s.carry) + '/')));
    var side = h('aside');
    side.appendChild(rhythmBox(s));
    side.appendChild(promptsBox(s));
    side.appendChild(askBox(s));
    cols.appendChild(sh); cols.appendChild(side); m.appendChild(cols);
  }
  function list(parent, title, arr, tag) { if (!(arr || []).length) return; parent.appendChild(h('h3', { text: title })); var l = h(tag || 'ul', { class: 'q' }); arr.forEach(function (x) { l.appendChild(h('li', { text: x })); }); parent.appendChild(l); }
  function rhythmBox(s) {
    var steps = (S.framework && S.framework.rhythm) || [];
    var day = s.date || s.id, key = 'bw-rhythm-' + day, ticks = Object.assign({}, S.live ? S.rhythm[day] || {} : store(key) || {}), box = h('section', { class: 'sheet' }, h('span', { class: 'eyebrow', text: 'The rhythm' }));
    if (!steps.length) { box.appendChild(h('p', { class: 'empty', text: 'Barny\'s order for a Sabbath in the workshop shows here.' })); return box; }
    var ol = h('ol', { class: 'rhythm' }), total = 0;
    steps.forEach(function (st, i) {
      var name = typeof st === 'string' ? st : (st.step || st.name || ''), min = typeof st === 'object' ? st.minutes : null; total += +min || 0;

      cb.addEventListener('change', function () { ticks[i] = cb.checked; if (S.live) { S.rhythm[day] = ticks; saved(mine('rhythm-' + day).set({ ticks: ticks, at: new Date().toISOString() })).catch(function () {}); } else store(key, ticks); render(); });
      ol.appendChild(h('li', { class: ticks[i] ? 'done' : '' }, cb, h('span', { class: 't' }, name, st.what ? h('div', { class: 'note', text: st.what }) : null), h('span', { class: 'm', text: min ? min + ' min' : '' })));
    });
    box.appendChild(ol); if (total) box.appendChild(h('p', { class: 'note', text: 'About ' + total + ' minutes. Ticks save to your account, so your phone and laptop match.' }));
    return box;
  }
  function promptsBox(s) {
