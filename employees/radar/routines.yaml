# Radar's routines. `npm run radar -- compile` turns each into a self-contained prompt in employees/radar/routines/<id>.md
# and `npm run radar -- deploy` prints the trigger payloads. The routine reads the live repo files first when it can;
# the embedded copy is the fallback. Times are Pacific.
#
# Why four, not six: routines created by an agent in this organisation carry no connectors, so every Radar routine
# reuses a trigger Kev's account already holds with connectors attached. The Friday week review runs inside Friday's
# check-out; the Sunday Edition is built by the stand-up routine's Saturday-night run (the one build allowed on the
# Sabbath). The hourly sweep took over the retired "Calendar Auto-Fill" trigger (its original prompt is kept in
# docs/retired-routines.md).
branch: claude/pensive-brown-18gll8
routines:
  - id: brief
    name: "Radar · 5:30 brief"
    trigger_id: trig_01CWiJZcDZS9xJGZrxo5sjVh
    cron: "CRON_TZ=America/Los_Angeles 22 5 * * 0-5"
    model: claude-opus-5-5
    skills: [standing-rules, interrupt-rules, trust-ramp, morning-brief]
    seeds: [sources, rhythm]
    notify: push
  - id: sweep
    name: "Radar · inbox sweep (hourly)"
    trigger_id: trig_012VfA1Y4EBzyFoixKVGmNug
    cron: "CRON_TZ=America/Los_Angeles 7 7-18 * * 1-5"
    model: claude-opus-5-5
    skills: [standing-rules, ledger, interrupt-rules, trust-ramp, inbox-sweep, invoicing]
    seeds: [sources, people]
    notify: none
  - id: check-out
    name: "Radar · EOD check-out (5:30pm; Friday adds the week review)"
    trigger_id: trig_01W4kTyfCd7VhMkvt5LDRZ9s
    cron: "CRON_TZ=America/Los_Angeles 30 17 * * 1-5"
    model: claude-sonnet-5
    skills: [standing-rules, ledger, trust-ramp, roster-liaison, check-out, week-review]
    seeds: [sources, people, rhythm]
    notify: none
  - id: stand-up
    name: "Radar · stand up tomorrow (builds The Eden Daily; Saturday builds the Sunday Edition)"
    trigger_id: trig_016GSTsKArqZBPRZc2ZzFaTj
    cron: "CRON_TZ=America/Los_Angeles 47 20 * * 0-4,6"
    model: claude-opus-5-5
    skills: [standing-rules, ledger, stand-up-tomorrow, sunday-edition]
    seeds: [sources, people, rhythm, c12-framework]
    notify: push
