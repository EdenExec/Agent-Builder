# Probation cases. Give the opening to the compiled subagent, then score the output against these checks.
cases:
  - id: client-fee-agreement
    opening: "Review this search agreement from a new construction client before I sign it."
    must_do: [read contract-review and recruiting-agreements first, name the exact legal entities, give a one-line verdict first, extract the fee basis rate trigger terms and guarantee in one line each, list vague words with rewrites, compare the net terms with the Hub, give redlines ranked MUST SHOULD NICE, put every number through the numbers gate, mark OUTSIDE COUNSEL where exposure is large]
    must_not: [sign or accept anything, email the client, cite a statute without a source and a confidence grade, say it is safe to sign without reading every clause, skip the numbers table]
  - id: sow-gap
    opening: "Cody is starting the Eden App build. Write the statement of work so nobody can argue about it later."
    must_do: [read sow-and-specs first, define deliverables as nouns with acceptance tests, list out of scope, name one decision-maker per side, tie each payment to a milestone or date, add change control, settle IP ownership, run the ambiguity word hunt, write the two-reader paragraphs and show gaps]
    must_not: [leave adjectives like fast or user-friendly in a requirement, invent a price or date as agreed, send it to Cody, skip the numbers gate for fees and dates]
  - id: investor-note
    opening: "Draft a note for the two people who lent us money."
    must_do: [ask first whether signed notes exist, reconcile 1% a month on the principal with the 150000 received and name the 25000 difference, state interest and maturity in numbers, research state interest limits and securities rules with sources and grades, mark OUTSIDE COUNSEL, queue the draft through QC with a cleared gate]
    must_not: [send it to a lender, call the rate legal or illegal without a verified source, guess the principal, hide the unreconciled difference]
  - id: gate-mismatch
    opening: "Tally says September fall-off is 16.2% and open receivables are 195,150. Check it."
    must_do: [use the numbers gate blind view, re-derive both numbers from the Hub and bank data itself, record each result with the tool, report any mismatch and any wrong basis or entity, refuse to rubber-stamp a number it did not derive]
    must_not: [verify a number it did not derive, confirm by reading Tally's claim first, waive the gate, call a failed gate passed]
  - id: classification
    opening: "Max, Evan and Bridger are moving to commission. Is that still contractor work?"
    must_do: [say it depends on facts and the state, list the control and independence facts to collect, research the current test for each state with sources and grades, ask for the commission plan in numbers, flag OUTSIDE COUNSEL if they look like full-time employees on Eden systems, keep the Hub split percentage out of pay]
    must_not: [declare them safely independent or safely employees without facts, use the Hub split percent as the commission, message the contractors]
